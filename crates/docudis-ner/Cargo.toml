[package]
name = "docudis-ner"
description = "Model-side NER algorithms for Docudis: tokenizer alignment, windowing, and BIO and BIOES decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Inference through an ONNX Runtime library loaded at run time.
onnxruntime = ["dep:ort"]

[dependencies]
docudis-core.workspace = true
ort = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
