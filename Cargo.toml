[workspace]
members = [
    "crates/docudis-ner",
    "crates/docudis-ner-capi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stonetech-pxia/docudis-ner"

[workspace.dependencies]
docudis-core = { git = "https://github.com/stonetech-pxia/docudis-core.git", rev = "7244cd35964995368bb87fc189723dd90b2a8d30" }
# 2.0 has no stable release yet: pin the release candidate exactly.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
